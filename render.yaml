services:
  - type: web
    name: melo-dj
    runtime: docker
    repo: https://github.com/manlinayu-code/melo-dj
    branch: main
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
        # Supabase PostgreSQL connection string
        # Format: postgresql://postgres.[ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ID
        generateValue: true
      - key: APP_SECRET
        generateValue: true
      - key: KIMI_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: FISH_AUDIO_API_KEY
        sync: false
      - key: MIMO_API_KEY
        sync: false
    healthCheckPath: /health

  # Supabase handles PostgreSQL — no Render managed DB needed.
  # Commented out for reference; uncomment if switching back to Render MySQL.
  # - type: mysql
  #   name: melo-dj-db
  #   plan: free
  #   databaseName: melo_dj
